- id: WALK-01
  section: Walk-in test
  category: defense
  requirement: The defense capture is of a space the candidate has never seen.
  quote: At the defense we capture a space you have never seen
- id: WALK-02
  section: Walk-in test
  category: defense
  requirement: The evaluators capture with their own iPhone 15 or newer. The model is not known in advance.
  quote: with our own iPhone 15 or newer
- id: WALK-03
  section: Walk-in test
  category: defense
  requirement: The evaluators choose the tier on the day.
  quote: choosing the tier on the day
- id: WALK-04
  section: Walk-in test
  category: defense
  requirement: The evaluators follow the capture route exactly.
  quote: following your capture route exactly.
- id: WALK-05
  section: Walk-in test
  category: defense
  requirement: 'The pipeline runs cold: no tuning for the space, no manual edits, no precomputed results.'
  quote: Your pipeline runs on it cold, in front of us.
- id: WALK-06
  section: Walk-in test
  category: defense
  requirement: The live model path runs at the defense, not a cache replay.
  quote: because the walk-in test runs live.
- id: WALK-07
  section: Walk-in test
  category: defense
  requirement: The pipeline runs while the evaluators laser the space, so runtime matters.
  quote: We measure the space with a laser measurer while it runs
- id: WALK-08
  section: Walk-in test
  category: defense
  requirement: Output is scored on the spot against their laser readings, so it must be quick to read.
  quote: score your output against those measurements on the spot.
- id: WALK-09
  section: Walk-in test
  category: defense
  requirement: All three tiers are ready to run at the defense.
  quote: All three tiers must be ready to run.

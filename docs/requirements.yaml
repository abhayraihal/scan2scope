- id: SCORE-01
  section: Scoring
  category: scoring
  requirement: The walk-in test is worth 30%. It targets systems that only work on their author's data.
  quote: '30% The walk-in test: cold run on our capture, scored against our laser measurements taken in the room / Systems that only work on their author''s data'
- id: SCORE-02
  section: Scoring
  category: scoring
  requirement: The fix loop delta is worth 25%. It targets diagnosis without repair.
  quote: 25% Fix loop delta / Diagnosis shipped in place of repair
- id: SCORE-03
  section: Scoring
  category: scoring
  requirement: Verified benchmark accuracy across all three tiers is worth 15%. It targets claims that fail under reproduction.
  quote: 15% Verified benchmark accuracy across all three tiers / Claims that evaporate under reproduction
- id: SCORE-04
  section: Scoring
  category: scoring
  requirement: Compliance matrix coverage is worth 10%. It targets building a different product from the one specified.
  quote: 10% Compliance matrix coverage / Building a different product than the one specified
- id: SCORE-05
  section: Scoring
  category: scoring
  requirement: The head-to-head is worth 10%. It targets benchmark avoidance.
  quote: 10% Head-to-head vs incumbent app like magicplan or poly.cam / Benchmark avoidance
- id: SCORE-06
  section: Scoring
  category: scoring
  requirement: 'Capture route quality is worth 5%: install time, protocol clarity and what a non-engineer would experience.'
  quote: '5% Capture route quality: install time, protocol clarity, what a non-engineer would experience / Pipelines with no path to a user''s hands'
- id: SCORE-07
  section: Scoring
  category: scoring
  requirement: Process evidence is worth 5%. It targets single-commit repos nobody can audit.
  quote: 5% Process evidence / Unauditable single-commit repos
- id: SCORE-08
  section: Scoring
  category: scoring
  requirement: Confident garbage on thin input caps the total score.
  quote: confident garbage on thin input caps your total score.
- id: SCORE-09
  section: Scoring
  category: scoring
  requirement: Fix loop full marks need a correct root cause, a shipped fix, and the gate moving from fail to pass.
  quote: 'Correct root cause, shipped fix, gate moves from fail to pass: full marks'
- id: SCORE-10
  section: Scoring
  category: scoring
  requirement: A correct root cause and shipped fix that move the number without passing the gate earn majority marks, but only if the report says why it fell short.
  quote: 'Correct root cause, shipped fix, meaningful movement short of the gate: majority marks when the report says why it fell short'
- id: SCORE-11
  section: Scoring
  category: scoring
  requirement: A prediction that is badly wrong in either direction earns marks for post-mortem honesty only, none for the prediction.
  quote: 'Prediction badly wrong either direction: marks for the post-mortem''s honesty, none for the prediction'
- id: SCORE-12
  section: Scoring
  category: scoring
  requirement: Analysis with no shipped fix scores zero on the fix loop.
  quote: 'Analysis with no shipped fix: zero, regardless of quality'
- id: SCORE-13
  section: Scoring
  category: scoring
  requirement: A fix without regenerable before and after runs scores zero on the fix loop.
  quote: 'Fix with no regenerable before/after: zero'
- id: SCORE-14
  section: Scoring
  category: scoring
  requirement: A deadline dump scores zero on process evidence and casts suspicion on the narrative report.
  quote: scores zero on this part and its narrative report is read with proportional suspicion.
- id: SCORE-15
  section: Scoring
  category: scoring
  requirement: Report length trades against engineering time, and the engineering is what gets scored.
  quote: 'The page cap is deliberate: report length trades against engineering time, and we score the engineering.'

# Atomic requirements extracted from the case-study brief (Aug 2026). One row per requirement.
- id: CAP-01
  section: Part 1
  category: constraint
  requirement: No captures are supplied. The candidate owns everything from the phone's sensors to the output, the same way the incumbent apps do.
  quote: We provide no captures. Like the incumbent scanning apps, you own the problem from the phone's sensors onward.
- id: CAP-02
  section: Part 1
  category: capture
  requirement: Pick one of the two capture routes and say which one the submission uses.
  quote: 'You choose one of two capture routes and both are legitimate:'
- id: CAP-03
  section: Part 1 / Route 1
  category: capture
  requirement: Route 1 is a custom iOS capture app that records SDK data (ARKit, RoomPlan, raw LiDAR depth, camera, IMU or more).
  quote: 'Route 1: Your own iOS capture app. ARKit, RoomPlan, raw LiDAR depth, camera, IMU, whatever you pull from the SDK.'
- id: CAP-04
  section: Part 1 / Route 1
  category: deliverable
  requirement: The Route 1 app ships as a TestFlight build or a dev build.
  quote: Ship it as a TestFlight build or a dev build
- id: CAP-05
  section: Part 1 / Route 1
  category: capture
  requirement: The Route 1 app installs on the evaluators' own device in under 10 minutes.
  quote: we can install on our device in under 10 minutes.
- id: CAP-06
  section: Part 1 / Route 2
  category: capture
  requirement: 'Route 2 names the exact off-the-shelf capture tool for each tier: the native camera, a LiDAR logging app, or another App Store app.'
  quote: Name the off-the-shelf capture tool (a LiDAR logging app, the native camera, anything installable from the App Store)
- id: CAP-07
  section: Part 1 / Route 2
  category: constraint
  requirement: Route 2 tools must install from the App Store or be the native camera. No sideloading and no developer steps.
  quote: anything installable from the App Store
- id: CAP-08
  section: Part 1 / Route 2
  category: deliverable
  requirement: The protocol is one page.
  quote: write the one-page protocol
- id: CAP-09
  section: Part 1 / Route 2
  category: capture
  requirement: The protocol is written for a non-engineer.
  quote: a non-engineer follows
- id: CAP-10
  section: Part 1 / Route 2
  category: capture
  requirement: The protocol says what to install.
  quote: what to install
- id: CAP-11
  section: Part 1 / Route 2
  category: capture
  requirement: The protocol says how to walk.
  quote: how to walk
- id: CAP-12
  section: Part 1 / Route 2
  category: capture
  requirement: The protocol says how long to capture.
  quote: how long
- id: CAP-13
  section: Part 1 / Route 2
  category: capture
  requirement: The protocol says what to avoid.
  quote: what to avoid
- id: CAP-14
  section: Part 1 / Route 2
  category: capture
  requirement: The protocol says how to hand the files to the pipeline.
  quote: how to hand the files to your pipeline
- id: CAP-15
  section: Part 1 / Route 2
  category: defense
  requirement: Each step must have only one reading. The evaluators follow the page literally at the defense, and an ambiguous step degrades their capture.
  quote: At the defense we follow your page literally. If the page is ambiguous, the capture you get reflects that.
- id: CAP-16
  section: Part 1 / Walk-in test
  category: capture
  requirement: 'Derived: the capture route covers all three tiers, because the evaluators pick the tier on the day and follow the route exactly.'
  quote: choosing the tier on the day, following your capture route exactly.
- id: TIER-01
  section: Part 1 / Tiers
  category: capture
  requirement: The photo, video and LiDAR tiers are all mandatory.
  quote: Three input tiers, all mandatory.
- id: TIER-02
  section: Part 1 / Tiers
  category: output-contract
  requirement: Every tier produces the same output contract, including damage, concealed-damage flags and scope items at the photo tier.
  quote: The same output contract from each
- id: TIER-03
  section: Part 1 / Tiers
  category: output-contract
  requirement: Intervals widen as sensor data thins, and the widening is honest (calibrated).
  quote: with intervals that widen honestly as sensor data thins
- id: TIER-04
  section: Part 1 / Tiers
  category: capture
  requirement: The photo tier takes 2 to 8 stills per room.
  quote: Photos. 2 to 8 stills per room
- id: TIER-05
  section: Part 1 / Tiers
  category: capture
  requirement: The photo tier works with any iPhone 15 or newer, non-Pro models included.
  quote: 2 to 8 stills per room from any iPhone 15 or newer
- id: TIER-06
  section: Part 1 / Tiers
  category: constraint
  requirement: The photo tier uses no depth and no poses.
  quote: no depth, no poses
- id: TIER-07
  section: Part 1 / Tiers
  category: capture
  requirement: Photo input is a set of folders, one per room.
  quote: A set of photo folders, one folder per room
- id: TIER-08
  section: Part 1 / Tiers
  category: output-contract
  requirement: The photo folders produce the same stitched whole-property plan the other tiers produce.
  quote: must produce the same stitched whole-property plan the other tiers produce
- id: TIER-09
  section: Part 1 / Tiers
  category: output-contract
  requirement: Photo-tier intervals are wider to match the thinner input.
  quote: with intervals widened accordingly.
- id: TIER-10
  section: Part 1 / Tiers
  category: output-contract
  requirement: 'Any picture in, results out: the photo tier always returns a schema-valid result.'
  quote: 'This is the floor: any picture in, results out.'
- id: TIER-11
  section: Part 1 / Tiers
  category: capture
  requirement: The video tier takes one handheld walkthrough clip.
  quote: Video. A handheld walkthrough clip
- id: TIER-12
  section: Part 1 / Tiers
  category: capture
  requirement: The video tier works with any iPhone 15 or newer.
  quote: A handheld walkthrough clip from any iPhone 15 or newer.
- id: TIER-13
  section: Part 1 / Tiers
  category: capture
  requirement: The LiDAR tier uses depth, poses and intrinsics.
  quote: LiDAR. Depth, poses and intrinsics
- id: TIER-14
  section: Part 1 / Tiers
  category: capture
  requirement: The LiDAR tier targets Pro-class devices that have LiDAR.
  quote: on Pro-class devices.
- id: TIER-15
  section: Part 1 / Tiers
  category: deliverable
  requirement: A device matrix states which tier runs on which hardware.
  quote: You submit a device matrix stating which tier runs on which hardware
- id: TIER-16
  section: Part 1 / Tiers
  category: deliverable
  requirement: The device matrix states the accuracy each tier honestly delivers.
  quote: what accuracy each tier honestly delivers.

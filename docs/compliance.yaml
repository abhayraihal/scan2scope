# GATE rows take their status from the final benchmark reports (docs/benchmark_report.md, generated copies in docs/benchmark/): pass when every tier with data passes, fail when none does, partial when the tiers differ, when the gate could not be measured on benchmark data, or when the report says the data are too few to show the property (calibration on one real room). Each note names the tier and whether its data is real (the one bedroom, iPhone 17) or synthetic (LiDAR).

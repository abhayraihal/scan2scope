# Error model per tier, 1-sigma. Read by scan2scope.uncertainty.model.annotate.
# sigma(L) = sqrt((L s)^2 + a^2); interval = value -/+ z q sigma with q from calibration.yaml.
# These are priors, not fitted values. calibrate.fit_q rescales them per tier once there are enough rooms.
level: 0.9
z: 1.645

tiers:
  lidar:
    scale_floor: 0.003        # s, log-scale sigma shared by every measurement; s = max(floor, capture estimate)
    additive: {length: 0.008, height: 0.006, opening: 0.012}   # metres
    vertical: 0.0             # log sigma of heights on top of s; LiDAR depth is metric in every direction
  video:
    # One MapAnything metric estimate is good to about 0.08 in log scale (photo.SCALE_LOG_SIGMA). The chunks
    # of a walkthrough are runs of the same model on the same camera and room, so they share that error and
    # averaging them does not take the floor below it.
    scale_floor: 0.08
    additive: {length: 0.025, height: 0.02, opening: 0.03}
    # Heights are seen across the image and lengths partly in depth, so a field-of-view error scales them
    # differently: ceilings on 11 photo and video captures of 4 real rooms missed by 0.13 in log RMS.
    vertical: 0.1
  photo:
    scale_floor: 0.08         # one MapAnything run per room; the geometry stage reports the same 0.08
    additive: {length: 0.04, height: 0.035, opening: 0.04}
    vertical: 0.1

# Damage width, height and length: sqrt((v s)^2 + a^2); area uses the bounding-box perimeter times a.
damage_additive: 0.02

# Multipliers on the additive term. Tables are checked top to bottom, first match wins.
inflation:
  observed_fraction:
    - {below: 0.3, factor: 2.0}
    - {below: 0.6, factor: 1.4}
  n_points:
    - {below: 30, factor: 1.6}
    - {below: 100, factor: 1.25}
  placement_uncertain: 1.5    # footprint and extents, when any room could not be placed
  low_light: 1.3
  few_photos: {below: 4, factor: 1.5}
  missing_exif_focal: 1.2

# Capture consistency.
capture:
  loop_min_overlap: 0.2       # a rejected loop closure counts as a drift measurement only if it registered
  loop_min_inliers: 0.3       # this well
  loop_max_rot_deg: 20.0
  report_ratio: 1.1           # list a capture reason when it raises s by more than this factor

# Error model per tier, 1-sigma. Read by scan2scope.uncertainty.model.annotate.
# sigma(L) = sqrt((L s)^2 + a^2); interval = value -/+ z q sigma with q from calibration.yaml.
# These are priors, not fitted values. calibrate.fit_q rescales them per tier once there are enough rooms.
level: 0.9
z: 1.645

tiers:
  lidar:
    scale_floor: 0.003        # s, log-scale sigma shared by every measurement; s = max(floor, capture estimate)
    additive: {length: 0.008, height: 0.006, opening: 0.012}   # metres
  video:
    scale_floor: 0.03
    additive: {length: 0.025, height: 0.02, opening: 0.03}
  photo:
    scale_floor: 0.05
    additive: {length: 0.04, height: 0.035, opening: 0.04}

# Damage width, height and length: sqrt((v s)^2 + a^2); area uses the bounding-box perimeter times a.
damage_additive: 0.02

# Multipliers on the additive term. Tables are checked top to bottom, first match wins.
inflation:
  observed_fraction:
    - {below: 0.3, factor: 2.0}
    - {below: 0.6, factor: 1.4}
  n_points:
    - {below: 30, factor: 1.6}
    - {below: 100, factor: 1.25}
  placement_uncertain: 1.5    # footprint and extents, when any room could not be placed
  low_light: 1.3
  few_photos: {below: 4, factor: 1.5}
  missing_exif_focal: 1.2

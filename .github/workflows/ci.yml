name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install core dependencies (no model stack)
        run: uv sync --group dev
      - name: Unit tests on synthetic data
        run: uv run pytest -m "not ml" -q
